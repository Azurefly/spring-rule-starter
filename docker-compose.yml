
version: '3.8'
services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: ruledb
      POSTGRES_USER: ruleuser
      POSTGRES_PASSWORD: rulepass
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

volumes:
  db_data:
