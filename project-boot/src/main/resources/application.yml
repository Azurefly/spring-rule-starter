spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ruledb}
    username: ${DB_USERNAME:ruleuser}
    password: ${DB_PASSWORD:rulepass}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
    validate-on-migrate: true
    clean-disabled: true
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}
    show-sql: ${JPA_SHOW_SQL:false}
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          lob:
            non_contextual_creation: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
  servlet:
    multipart:
      max-file-size: ${RULE_MAX_FILE_SIZE:1MB}
      max-request-size: ${RULE_MAX_REQUEST_SIZE:1MB}
  rule:
    metrics:
      enabled: ${RULE_METRICS_ENABLED:true}

server:
  port: ${SERVER_PORT:8080}

rule:
  redis:
    enabled: ${RULE_REDIS_ENABLED:false}
  cors:
    allowed-origin-patterns: ${RULE_CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:5173}
  security:
    enabled: ${RULE_SECURITY_ENABLED:false}
    header-name: ${RULE_SECURITY_HEADER:X-Rule-Api-Key}
    admin-api-key: ${RULE_ADMIN_API_KEY:}
    reader-api-key: ${RULE_READER_API_KEY:}

management:
  endpoints:
    web:
      exposure:
        include: ${MANAGEMENT_ENDPOINTS:health,info}
  endpoint:
    health:
      show-details: ${MANAGEMENT_HEALTH_SHOW_DETAILS:never}
  health:
    redis:
      enabled: ${MANAGEMENT_REDIS_HEALTH_ENABLED:false}

logging:
  level:
    com.example: ${APP_LOG_LEVEL:INFO}
    com.azurefly: ${STARTER_LOG_LEVEL:INFO}
    org.kie: ${KIE_LOG_LEVEL:WARN}
    org.drools: ${DROOLS_LOG_LEVEL:WARN}
    root: ${ROOT_LOG_LEVEL:INFO}
