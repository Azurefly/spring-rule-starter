name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: ruledb
          POSTGRES_USER: ruleuser
          POSTGRES_PASSWORD: rulepass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ruleuser -d ruledb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_URL: jdbc:postgresql://localhost:5432/ruledb
      DB_USERNAME: ruleuser
      DB_PASSWORD: rulepass
      RULE_REDIS_ENABLED: 'false'
      MANAGEMENT_REDIS_HEALTH_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: temurin
          cache: maven
      - name: Test backend
        run: mvn -B clean verify

  backend-jdk17-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven
      - name: Verify Java 17 build compatibility
        run: mvn -B -DskipTests clean verify

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build frontend
        run: npm run build
